name: Site checks (tests, build, verify)

# GitHub Pages serves the branch root of main (legacy source), so the generated
# pages are committed. This workflow proves they are current and valid.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests (standard library only)
        run: python3 -m unittest discover -s pipeline/tests
      - name: Rebuild pages from data files
        run: python3 pipeline/build_site.py
      - name: Verify data rules, sources, links and blank-cell flags
        run: python3 pipeline/verify.py
      - name: Fail if committed pages differ from a fresh build
        run: |
          if [ -n "$(git status --porcelain -- '*.html' style.css)" ]; then
            git status --porcelain -- '*.html' style.css
            echo "Committed pages are stale; run pipeline/build_site.py and commit."
            exit 1
          fi
          echo "Committed pages match the build."
