name: Deploy static dashboard to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate data and HTML from source
        run: |
          python3 scripts/model.py
          python3 scripts/build_site.py

      - name: Verify the committed output matches a fresh build
        run: |
          if ! git diff --quiet -- data/ '*.html'; then
            echo "::error::Committed data/HTML does not match a fresh build."
            git --no-pager diff --stat -- data/ '*.html'
            exit 1
          fi
          echo "Generated output is reproducible and matches the commit."

      - name: Validate site (links, sourcing, missing values, ranges)
        run: python3 scripts/validate_site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
