name: Build and deploy NBA Edge Lab (GitHub Pages)

# Integration workflow. Published layout (one Pages artifact):
#   /                -> root index.html (canonical dashboard, generated by scripts/build_app.py)
#   /app/            -> canonical category pages (summary, lines, picks, props, strategies,
#                       correlations, injuries, game flow, questions, suggestions, verification,
#                       sources, review, flagged)
#   /review.html     -> cross-workstream Flagged for Review page (session arena/2e50a71a)
#   /dashboard/      -> independently verified build (session arena/925439ca-nba3): 17 pages
#                       generated by final/build_site.py from final/data, every stored value
#                       re-checked by final/verify.py against the official NBA pages
#   /docs/           -> f879620b data site (docs/data/data.json)
#   /site/           -> arena/7c532e8c site (generated from data/*.json by scripts/build_site.py)
#   /lab/            -> arena/5697caaf line lab (scripts/model.py, scripts/build_lab.py)
#   /research/       -> arena/9ed6085f research site (generated from data/*.csv by pipeline/build_site.py)
#   /edge/           -> arena-0a016df8 Edge Lab dashboard (verified game log, originated lines, gated picks)
#   /origin/         -> arena/e22a2831 origination engine (174-game verified log, walk-forward backtest, 7-gate leaderboard)
#   /verify/pages/   -> arena/3655c68d verification & decision layer (cross-pipeline reconciliation, corrections, decision queue)
#   /d01ae7e2/       -> session d01ae7e2 official-slate line origination & gated picks dashboard (data + docs + scripts)
#   /hub/            -> arena/99eabb04 consolidated dashboard (one namespace, one set of numbers, every row sourced)
#   /dash/           -> e40cd215 unified dashboard
#   /archive.html    -> dated index of every earlier session's dashboard (moved off the landing
#                       page by session dd1eb1f1 so the front door shows one navigation and
#                       one set of numbers)
#   /audit_736efb4b/ -> session 736efb4b: 11/14 01:30 PM ET official injury report transcribed row by row,
#                       compared with the published 04:15 AM snapshot, with Flagged for Review page
#   /audit_dd1eb1f1/ -> session dd1eb1f1 independent audit: official re-read compared row by row
#                       against the canonical artefact, plus the correlations measured to fill
#                       cells the canonical site publishes blank
#   /audit_94e6d41b/ -> session arena/94e6d41b-nba3: 2026-11-15 game-day refresh: newest official
#     injury reports (06:15 AM ET snapshot + 4 cross-reports), 11/14 finals settled, rolling
#     11/15-11/18 window, four-leg engine invariance proof, availability delta and settlement;
#     supersedes the 11/14 04:15 AM snapshot the manifest published before this round
#   /audit_1823b910/ -> session arena/1823b910-nba3: independent second transcription of the same
#                       11/14 01:30 PM ET report, the line-invariance proof, injury -> rotation impact,
#                       game flow, and this session's questions and suggestions
# Canonical site (this session, arena/8d3d0271-nba3): root index.html + app/*.html,
# generated by scripts/{capture_official_2026_11_14b,strategy_lab,assemble_canonical,build_app}.py
# Pull requests run every check but never deploy.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the 94e6d41b audit legs diff the engine against the published state
          # of main via `git show d320fea:...`; a shallow clone cannot do that
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fail on unresolved git conflict markers (CR-8D-05)
        run: |
          if grep -rn '^<<<<<<<' --exclude-dir=.git . ; then
            echo "::error::Unresolved git conflict markers found in the tree — resolve them before merging"
            exit 1
          fi
          echo "No unresolved conflict markers."
      - name: Unit tests (statistics module, f879620b)
        run: python3 -m unittest tests/test_validate_gates.py
      - name: Unit tests (injury-delta and capture-c cross-check rules, 8e199e09)
        run: |
          python3 -m unittest tests/test_injury_delta.py
          python3 -m unittest tests/test_capture_c.py
          python3 -m unittest tests/test_injury_delta_0130pm.py
      - name: 11/15 game-day capture replay and integrity tests (arena/bb0c83a4)
        run: |
          # Offline replay: the capture parses committed verbatim transcriptions only,
          # so this needs no network and a difference here means a real input changed.
          python3 scripts/capture_official_2026_11_15.py
          git diff --exit-code -- data/app/official_injuries_2026-11-15_0615AM.json \
            data/app/official_slate_1115_1118.json \
            data/app/official_team_ratings_2026-11-15.json \
            data/app/official_results_2026-11-14.json \
            data/app/official_capture_2026-11-15.json || {
            echo "the 11/15 captures drifted from the committed artefacts;"
            echo "the capture parses committed verbatim transcriptions, so a difference means a real change."
            exit 1
          }
          # Pins the 188-game log, the 30-team W/L/GP reconciliation, the 101-row
          # injury parse, the NF-90 rotation join and the 11/15-11/18 window.
          python3 -m unittest tests/test_capture_1115.py
      - name: Availability rule replay (arena/bb0c83a4)
        run: |
          python3 -c "
          import sys; sys.path.insert(0,'scripts')
          import report_availability as ra
          ra.SESSION='arena/bb0c83a4-nba3'
          ra.RESULTS_SOURCE='https://www.nba.com/results?date=2026-11-14'
          ra.main(slate_path='data/app/official_slate_1115_1118.json',
                  injury_path='data/app/official_injuries_2026-11-15_0615AM.json',
                  out_path='data/app/report_availability_2026-11-15.json',
                  as_of_date='2026-11-15', as_of_local_hour=6+40/60.0)
          "
          git diff --exit-code -- data/app/report_availability_2026-11-15.json
      - name: Data site checks (docs/ rows, sources, links)
        run: python3 tools/check_site.py
      - name: Unit tests (research pipeline, 9ed6085f)
        run: python3 -m unittest discover -s pipeline/tests
      - name: Root dashboard in-page links and link targets
        run: |
          test -s index.html
          test -s review.html
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse
          import os
          OFFICIAL = ('nba.com', 'kansspelautoriteit.nl')
          class Check(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=set(); self.hrefs=[]; self.rows=[]
                  self.in_tbody=False; self.row=None
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if 'id' in a: self.ids.add(a['id'])
                  if tag=='a' and 'href' in a:
                      self.hrefs.append(a['href'])
                      if self.row is not None: self.row.append(a['href'])
                  if tag=='tbody': self.in_tbody=True
                  if tag=='tr' and self.in_tbody: self.row=[]
              def handle_endtag(self, tag):
                  if tag=='tr' and self.row is not None:
                      self.rows.append(self.row); self.row=None
                  if tag=='tbody': self.in_tbody=False
          for filename in ('index.html', 'review.html'):
              p=Check(); p.feed(Path(filename).read_text(encoding='utf-8'))
              broken=[h for h in p.hrefs if h.startswith('#') and h[1:] not in p.ids]
              broken += [h for h in p.hrefs if not h.startswith(('#','http://','https://','mailto:')) and not os.path.exists(h.split('#')[0])]
              if broken: raise SystemExit(f'Broken links in {filename}: {broken}')
              for i,row in enumerate(p.rows,1):
                  sources=[]
                  for href in row:
                      u=urlparse(href)
                      if u.scheme=='https' and u.hostname and any(u.hostname==d or u.hostname.endswith('.'+d) for d in OFFICIAL):
                          sources.append(href)
                  if not sources: raise SystemExit(f'{filename}: table body row {i} has no official-source link')
              print(f'{filename}: {len(p.ids)} ids, {len(p.hrefs)} links, {len(p.rows)} sourced data rows checked.')
          PY
      - name: Build NBA Edge Lab site (fails on missing sources, broken links, drift)
        run: |
          python3 scripts/build_site.py
          git diff --exit-code -- site/
          test -z "$(git status --porcelain -- site/)" || { echo 'site/ has uncommitted or untracked changes'; git status --porcelain -- site/; exit 1; }
      - name: Build + validate the line-lab site (lab/)
        run: |
          python3 scripts/model.py
          python3 scripts/build_lab.py
          python3 scripts/validate_site.py
          test -z "$(git status --porcelain -- lab/)" || { echo 'lab/ is out of date; regenerate and commit'; git status --porcelain -- lab/; exit 1; }
      - name: Build and verify research site (9ed6085f)
        run: |
          python3 pipeline/build_site.py
          python3 pipeline/verify.py
          test -z "$(git status --porcelain -- research/)" || { echo 'research/ is stale; run pipeline/build_site.py and commit'; git status --porcelain -- research/; exit 1; }
      - name: Verification layer self-tests (session 3655c68d)
        run: python3 -m unittest verify.tests.test_verification
      - name: Build verification site and check its links
        run: |
          python3 verify/build.py
          test -z "$(git status --porcelain -- verify/pages/)" || { echo 'verify/pages/ is out of date; run verify/build.py and commit'; git status --porcelain -- verify/pages/; exit 1; }
      - name: Edge Lab checks (arena-0a016df8 — subpages, internal links, data JSON)
        run: python3 pipeline/check_site.py
      - name: Integration engine and unified dashboard (session e40cd215)
        run: |
          python3 -m integrate.engine
          git diff --exit-code -- data/integration/model.json
          python3 -m integrate.build_site
          python3 -m integrate.check
          test -z "$(git status --porcelain -- dash/ data/integration/)" || { echo 'dash/ is stale; run python3 -m integrate.build_site and commit'; git status --porcelain -- dash/ data/integration/; exit 1; }
          grep -q "dash/index.html" index.html || { echo "root index.html lost its link to dash/"; exit 1; }
      - name: Output-tree ownership audit (session e40cd215)
        run: |
          python3 - <<'PY'
          import ast, re, pathlib
          src = pathlib.Path('integrate/build_site.py').read_text()
          assert 'DASH = ROOT / "dash"' in src, "dash/ path changed"
          bad = [l for l in src.splitlines() if re.search(r'(ROOT / "(?!dash|index)[a-zA-Z_]+")', l) and 'write' in l]
          if bad:
              raise SystemExit("integrate/build_site.py writes outside its claim: " + "; ".join(bad[:3]))
          other_path = pathlib.Path('pipeline/build_site_data.py')
          other = other_path.read_text()
          tree = ast.parse(other, filename=str(other_path))
          out_assignments = [n for n in tree.body
                             if isinstance(n, ast.Assign)
                             and any(isinstance(t, ast.Name) and t.id == 'OUT' for t in n.targets)]
          if len(out_assignments) != 1 or ast.unparse(out_assignments[0].value) not in ("f'{ROOT}/edge/data'", 'f"{ROOT}/edge/data"'):
              raise SystemExit('pipeline/build_site_data.py OUT no longer resolves to ROOT/edge/data')
          writer = next((n for n in tree.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name == 'w'), None)
          opens = [n for n in ast.walk(writer) if isinstance(n, ast.Call) and isinstance(n.func, ast.Name)
                   and n.func.id == 'open' and len(n.args) >= 2 and isinstance(n.args[1], ast.Constant)
                   and n.args[1].value == 'w'] if writer else []
          if len(opens) != 1 or ast.unparse(opens[0].args[0]) not in ("f'{OUT}/{name}'", 'f"{OUT}/{name}"'):
              raise SystemExit('pipeline/build_site_data.py writer no longer writes through OUT')
          print('Ownership audit: pipeline writes to edge/data; site/data occurs only in the historical docstring.')
          print("Ownership audit: integrate/ writes only into dash/, data/integration/ and index.html.")
          PY
      - name: Canonical official-source capture + cross-check (arena/2b9f1ae1)
        run: |
          python3 scripts/capture_official_2026_11_14.py
          git diff --exit-code -- data/app/official_slate.json data/app/official_team_ratings_2026-11-14.json data/app/official_injuries_2026-11-13_0730PM.json
      - name: Official capture for the 11/14-11/17 window and cross-check (arena/8d3d0271)
        run: |
          python3 scripts/capture_official_2026_11_14b.py
          git diff --exit-code -- data/app/official_slate_1114_1117.json data/app/official_team_ratings_2026-11-14b.json data/app/official_injuries_2026-11-13_0745PM.json
      - name: Official capture c - fresh ratings, finals capture, results-log cross-check (25418e3f, step wired by 8e199e09)
        run: |
          python3 scripts/capture_official_2026_11_14c.py
          git diff --exit-code -- data/app/official_results_2026-11-13.json data/app/official_injuries_2026-11-14_0415AM.json data/app/official_team_ratings_2026-11-14c.json data/app/official_counts_2026-11-14.json
      - name: Injury-report freshness re-check vs the newest official report (arena/3bf80157)
        run: |
          # Parses the committed verbatim fetch of the newest official injury
          # report PDF (05:15 AM ET) and proves, offline and deterministically,
          # that it is content-identical to the published canonical snapshot,
          # and that the whole 27-game slate window matches its live re-read.
          python3 scripts/capture_official_2026_11_14d.py
          git diff --exit-code -- data/app/official_injuries_2026-11-14_0515AM.json
      - name: Strategy lab - line origination, gates and leaderboard (seeded, must reproduce byte for byte)
        run: |
          python3 scripts/strategy_lab.py
          git diff --exit-code -- data/app/lab.json || {
            echo "data/app/lab.json drifted from the committed artefact."
            echo "The lab is seeded and rounds every published float to 6 decimals (PUBLISH_DP),"
            echo "so a difference here means a real input changed, not machine noise."
            git --no-pager diff -- data/app/lab.json | head -60
            exit 1
          }
      - name: Assemble canonical dataset and build the dashboard (fails on a row without a source link or a broken link)
        run: |
          python3 scripts/assemble_canonical.py
          python3 scripts/build_app.py
          git diff --exit-code -- data/app/canonical.json app/ index.html || {
            echo "The canonical dataset or the generated pages drifted from what is committed."
            git --no-pager diff --stat -- data/app/canonical.json app/ index.html | tail -20
            git --no-pager diff -- data/app/canonical.json | head -40
            exit 1
          }
      - name: 11/16 refresh gates, two-estimator model and the round dashboard (arena/8f4fac33)
        run: |
          # The refresh parses committed verbatim captures only, so it needs no network. A failure
          # here means a real input changed or a gate failed; the gate report prints which.
          python3 scripts/refresh_2026_11_16.py --gates > /tmp/gates.txt || { cat /tmp/gates.txt; exit 1; }
          cat /tmp/gates.txt
          # The model is deterministic; the diff below is what proves it.
          python3 scripts/round_model_2026_11_16.py
          python3 scripts/build_round_site.py
          git diff --exit-code -- data/rounds/2026-11-16 round/ || {
            echo "The 11/16 round artefacts or pages drifted from what is committed."
            git --no-pager diff --stat -- data/rounds/2026-11-16 round/ | tail -20
            exit 1
          }
          test -z "$(git status --porcelain -- round/ data/rounds/2026-11-16)" || {
            echo 'round/ or data/rounds/2026-11-16 has untracked output; regenerate and commit'
            git status --porcelain -- round/ data/rounds/2026-11-16
            exit 1
          }
      - name: 11/16 1:00 PM ET filing round (arena/fbd2484b) - rebuild, gates, drift check
        run: |
          # The refresh parses committed verbatim transcripts only: no network. A non-zero exit
          # here means a build-scope freshness/provenance gate failed, and the rebuild is refused.
          python3 scripts/round2_2026_11_16.py --gates
          python3 scripts/round2_2026_11_16.py
          python3 scripts/build_round2_site.py
          git diff --exit-code -- data/rounds/2026-11-16-1300PM round2 || {
            echo "The 1:00 PM ET round artefacts or pages drifted from what is committed."
            git --no-pager diff --stat -- data/rounds/2026-11-16-1300PM round2 | tail -20
            exit 1
          }
          test -z "$(git status --porcelain -- round2/ data/rounds/2026-11-16-1300PM)" || {
            echo 'round2/ or data/rounds/2026-11-16-1300PM has untracked output; regenerate and commit'
            git status --porcelain -- round2/ data/rounds/2026-11-16-1300PM
            exit 1
          }
      - name: 11/16 1:00 PM ET round unit tests (arena/fbd2484b)
        run: python3 -m unittest tests.test_round2_2026_11_16 -v

      - name: 11/16 round unit tests (arena/8f4fac33)
        run: python3 -m unittest tests.test_round_2026_11_16 -v
      - name: Originated-lines attribution and availability labels (arena/bb0c83a4)
        run: python3 -m unittest tests.test_lines_attribution -v
      - name: Build and verify the consolidated dashboard (hub/)
        run: |
          python3 scripts/build_hub_data.py
          python3 scripts/build_hub.py
          test -z "$(git status --porcelain -- hub/ data/hub/)" || { echo 'hub/ or data/hub/ is out of date; regenerate and commit'; git status --porcelain -- hub/ data/hub/; exit 1; }

      - name: Verify the /dashboard/ dataset line by line against official NBA sources
        run: python3 final/verify.py
      - name: Rebuild the /dashboard/ site and fail on drift
        env:
          DASH_PAGES: >-
            dashboard/index.html dashboard/executive-summary.html
            dashboard/methodology.html dashboard/lines.html dashboard/projections.html
            dashboard/strategies.html dashboard/validation.html dashboard/correlations.html
            dashboard/injuries.html dashboard/gameflow.html dashboard/data.html
            dashboard/questions.html dashboard/suggestions.html dashboard/flagged.html
            dashboard/repo-review.html dashboard/sources.html dashboard/archives.html
        run: |
          python3 final/build_site.py
          git diff --exit-code -- $DASH_PAGES
          test -z "$(git status --porcelain -- $DASH_PAGES)" || {
            echo 'dashboard/ is stale; run final/build_site.py and commit'
            git status --porcelain -- $DASH_PAGES
            exit 1
          }
      - name: Check /dashboard/ links and per-row sources
        run: python3 final/check_site.py
      - name: Independent audit tree (session dd1eb1f1) - verification values and page rules
        run: python3 -m unittest discover -s audit_dd1eb1f1 -p 'test_*.py'
      - name: Injury freshness audit 736efb4b - regenerate, drift-check and test (11/14 01:30 PM ET official report)
        run: |
          python3 audit_736efb4b/capture.py
          python3 audit_736efb4b/compare.py
          python3 audit_736efb4b/build.py
          test -z "$(git status --porcelain -- audit_736efb4b/)" || {
            echo 'audit_736efb4b/ is stale; run capture.py, compare.py and build.py and commit'
            git status --porcelain -- audit_736efb4b/
            exit 1
          }
          python3 -m unittest discover -s audit_736efb4b -p 'test_*.py'
      - name: Independent audit tree (session 7f3b89af) - fresh captures, checks, analysis, pages
        run: |
          # checks.py exits non-zero BY DESIGN when a check fails, so under the
          # workflow's default `bash -e` a single failing check aborted the step
          # before the drift gate below could report what actually changed. It was
          # masked while checks.py happened to be failing on a stale snapshot;
          # session arena/bb0c83a4 re-pointed it at the frozen 2026-11-14 artefacts
          # (data/snapshots/) and it now passes 12/12, but a future real failure
          # must still reach the drift gate rather than vanish. Capture its status.
          set +e
          python3 audit_7f3b89af/checks.py
          CHECKS_STATUS=$?
          set -e
          echo "audit_7f3b89af/checks.py exit status: $CHECKS_STATUS"
          if [ "$CHECKS_STATUS" -ne 0 ]; then
            echo "::error::audit_7f3b89af/checks.py reported a failed check; see its log above."
          fi
          python3 audit_7f3b89af/analysis.py
          python3 audit_7f3b89af/build.py
          python3 -m unittest discover -s audit_7f3b89af -p 'test_*.py'
          git diff --exit-code -- audit_7f3b89af/data audit_7f3b89af/pages || {
            echo "audit_7f3b89af/ drifted: the committed captures, report, analysis or pages do not"
            echo "reproduce. The captures are transcriptions of official pages and must not be"
            echo "regenerated silently by a build."
            git status --porcelain -- audit_7f3b89af/data audit_7f3b89af/pages
            exit 1
          }
          test -z "$(git status --porcelain -- audit_7f3b89af/data audit_7f3b89af/pages)" || {
            echo 'audit_7f3b89af/ has uncommitted changes'
            git status --porcelain -- audit_7f3b89af/data audit_7f3b89af/pages
            exit 1
          }
      - name: Injury-report refresh capture and cross-check (arena/1823b910, offline replay)
        run: |
          python3 scripts/capture_official_2026_11_14e.py
          git diff --exit-code -- data/app/official_injuries_2026-11-14_0130PM.json || {
            echo "the 01:30 PM snapshot drifted from the committed artefact;"
            echo "the capture parses committed verbatim fetches only, so a difference means a real change."
            git --no-pager diff -- data/app/official_injuries_2026-11-14_0130PM.json | head -60
            exit 1
          }
      - name: Build the injury-refresh audit tree and fail on drift (arena/1823b910)
        run: |
          python3 audit_1823b910/analysis.py
          python3 audit_1823b910/build.py
          test -z "$(git status --porcelain -- audit_1823b910/)" || {
            echo 'audit_1823b910/ is out of date; run analysis.py then build.py and commit'
            git status --porcelain -- audit_1823b910/
            exit 1
          }
      - name: Unit tests (injury-refresh audit, arena/1823b910)
        run: python3 -m unittest discover -s audit_1823b910 -p 'test_*.py'
      - name: Game-day refresh capture and cross-check (arena/94e6d41b, offline replay)
        run: |
          python3 scripts/capture_official_2026_11_15.py
          git diff --exit-code -- data/app/official_injuries_2026-11-15_0615AM.json data/app/official_slate_1115_1118.json data/app/official_results_2026-11-14.json data/app/official_team_ratings_2026-11-15.json data/app/players_top31_2026-11-15.csv || {
            echo "a 2026-11-15 capture drifted from the committed artefact;"
            echo "the capture parses committed verbatim fetches only, so a difference means a real change."
            git --no-pager diff -- data/app/official_injuries_2026-11-15_0615AM.json | head -60
            exit 1
          }
      - name: Build the game-day refresh audit tree and fail on drift (arena/94e6d41b)
        run: |
          python3 audit_94e6d41b/analysis.py
          python3 audit_94e6d41b/build.py
          git diff --exit-code -- audit_94e6d41b/data audit_94e6d41b/pages || {
            echo "audit_94e6d41b/ drifted: the committed captures, analysis or pages do not"
            echo "reproduce. The captures are transcriptions of official pages and must not be"
            echo "regenerated silently by a build."
            git status --porcelain -- audit_94e6d41b/data audit_94e6d41b/pages
            exit 1
          }
      - name: Unit tests (game-day refresh audit, arena/94e6d41b)
        run: python3 -m unittest discover -s audit_94e6d41b -p 'test_*.py'

      - name: 11/15 capture round + estimator layer, offline replay (arena/79341829)
        run: |
          python3 scripts/capture_round_79341829.py
          python3 scripts/estimators_round_79341829.py
          python3 scripts/minutes_model.py
          python3 scripts/results_feed.py verify
          python3 scripts/pick_ledger.py verify
          python3 scripts/preregister.py verify
          # --now-from-manifest: evaluate F2 at the manifest's newest source read,
          # not the wall clock, so an offline CI replay cannot go red at 00:00 UTC
          # while the committed captures are still the newest official ones.
          # The scheduled refresh (refresh.yml) keeps the wall clock on purpose.
          python3 scripts/freshness_gates_round_79341829.py --manifest data/app/refresh/2026-11-15T11-33Z/manifest.json --now-from-manifest
          git diff --exit-code -- data/app/results_feed.json data/app/estimators.json \
            data/app/minutes_model.json data/app/official_injuries_2026-11-15_0615AM_79341829.json \
            data/app/injury_delta_1115.json data/app/player_game_logs.json \
            data/app/minutes_shares.json data/app/prereg data/app/ledger || {
            echo "the 11/15 capture/estimator chain drifted from the committed artefacts;"
            echo "these outputs are deterministic replays of committed verbatim captures."
            git --no-pager diff -- data/app | head -80
            exit 1
          }
      - name: Unit tests (capture, results feed, pick ledger, estimators, gates)
        run: |
          python3 -m unittest discover -s tests -p 'test_*1115*.py' -v
          python3 -m unittest discover -s tests -p 'test_*round*.py' -v
          python3 -m unittest discover -s tests -p 'test_results_feed.py' -v
          python3 -m unittest discover -s tests -p 'test_pick_ledger.py' -v
          python3 -m unittest discover -s tests -p 'test_estimators.py' -v
          python3 -m unittest discover -s tests -p 'test_freshness_gates.py' -v
      - name: Live pipeline - freshness gates, model, availability, sealed ledger, two surfaces (arena/2ebb1e75)
        run: |
          python3 scripts/injury_archive.py
          python3 scripts/build_results_feed.py
          python3 scripts/estimators.py
          python3 scripts/availability.py
          python3 scripts/rest_travel.py
          python3 scripts/ledger.py
          python3 scripts/publish_picks.py
          python3 scripts/freshness_gates.py
          python3 scripts/repo_review.py
          python3 scripts/build_live_site.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          # Deterministic + drift-free: every artefact the steps above write must match what is
          # committed. The ledger is append-only, so a difference there means a pick was editorialised.
          git diff --exit-code -- data/live prereg ledger projection bet || {
            echo "The live pipeline artefacts drifted from what is committed."
            echo "The model is deterministic and the ledger is append-only, so a diff here is real."
            git --no-pager diff --stat -- data/live prereg ledger projection bet | tail -20
            exit 1
          }

      - name: v2 pipeline tests (two estimators, gate set, copula, ledger)
        run: python3 -m unittest discover -s pipeline/v2/tests -p 'test_*.py'

      - name: v2 build (gates first; refuses to publish on a blocking gate failure) and drift check
        run: |
          # The build WRITES the artefact, so its timestamp is the runner's clock
          # and the file can never be compared byte for byte on a different machine.
          # What is compared instead is a fresh in-memory rebuild against the
          # committed file, with only the fields the artefact itself declares as
          # volatile (VOLATILE, written into build.json) removed. Every model
          # output is still compared; only the clock is excluded.
          python3 -m pipeline.v2.build
          python3 -m pipeline.v2.build --check || {
            echo "the committed data/v2/build.json does not reproduce from the same captures."
            echo "A difference outside the declared volatile fields means a real input changed."
            exit 1
          }
          python3 scripts/build_v2.py
          test -z "$(git status --porcelain -- v2/)" || {
            echo 'v2/ is stale; run python3 scripts/build_v2.py and commit'
            git status --porcelain -- v2/
            exit 1
          }

      - name: Audit 00b0c780 — rebuild from data, drift check, unit tests (arena/00b0c780-nba3)
        run: |
          python3 audit_00b0c780/make_data.py
          python3 audit_00b0c780/build.py
          test -z "$(git status --porcelain -- audit_00b0c780/)" || {
            echo 'audit_00b0c780/ drifted: committed data or pages do not reproduce'
            git status --porcelain -- audit_00b0c780/
            exit 1
          }
          python3 -m unittest discover -s audit_00b0c780 -p 'test_*.py'
          rm -rf audit_00b0c780/__pycache__

      - name: Stage combined Pages artifact
        run: |
          rm -rf _pages && mkdir _pages
          cp index.html _pages/
          cp -r app _pages/app
          cp review.html _pages/review.html
          cp archive.html _pages/archive.html
          cp -r audit_dd1eb1f1 _pages/audit_dd1eb1f1
          rm -rf audit_1823b910/__pycache__
          cp -r audit_1823b910 _pages/audit_1823b910
          rm -rf audit_94e6d41b/__pycache__ audit_94e6d41b/.legs
          cp -r audit_94e6d41b _pages/audit_94e6d41b
          cp -r audit_736efb4b _pages/audit_736efb4b
          cp -r audit_7f3b89af _pages/audit_7f3b89af
          cp -r audit_00b0c780 _pages/audit_00b0c780
          cp executive-summary.html _pages/
          cp -r dashboard _pages/dashboard
          cp -r docs _pages/docs
          cp -r site _pages/site
          cp -r lab _pages/lab
          cp -r research _pages/research
          cp -r edge _pages/edge
          cp -r origin _pages/origin
          cp -r dash _pages/dash
          cp -r verify _pages/verify
          cp -r d01ae7e2 _pages/d01ae7e2
          cp -r hub _pages/hub
          cp -r round _pages/round
          cp -r round2 _pages/round2
          # 2026-11-17 round (session 2ecbccfd). round2/ was already taken by fbd2484b's F13
          # surface, so this round publishes as round_2ecbccfd/; one line, nothing else here moved.
          cp -r round_2ecbccfd _pages/round_2ecbccfd
          cp -r v2 _pages/v2
          cp -r projection _pages/projection
          cp -r bet _pages/bet
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
