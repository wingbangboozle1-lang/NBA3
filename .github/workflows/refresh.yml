name: official data refresh

on:
  schedule:
    # 05:15 / 11:15 / 17:15 / 23:15 UTC — around each official injury-report filing window
    - cron: "15 5,11,17,23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "fetch + gate report only (no rebuild, no commit)"
        default: "false"

permissions:
  contents: write

# One refresh at a time: a second run waits instead of racing the push to main.
concurrency:
  group: official-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the PDF text extractor used to transcribe captured game books
        # Optional by design: with the library missing, scripts/refresh_official.py still
        # stores every game's PDF with its retrieval stamp and manifest hash, it just cannot
        # render the text into data/app/gamebooks/*.md, and the run says so out loud instead
        # of failing. Never a hard dependency of the rebuild.
        run: python3 -m pip install --quiet pypdf || echo "::warning::pypdf install failed; game-book PDFs will be stored but not transcribed this run"

      - name: Fetch official sources (injury report, schedule, results, game books, team stats)
        run: python3 scripts/refresh_official.py ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Unit tests (capture, feed, ledger, estimators, gates)
        run: |
          python3 -m unittest discover -s tests -p "test_*1115*.py" -v
          python3 -m unittest discover -s tests -p "test_results_feed.py" -v
          python3 -m unittest discover -s tests -p "test_pick_ledger.py" -v
          python3 -m unittest discover -s tests -p "test_freshness_gates.py" -v
          python3 -m unittest tests/test_refresh_official.py -v

      - name: Commit refreshed captures and rebuilt outputs
        # The rebuild chain (scripts/refresh_official.py step 6) regenerates files OUTSIDE
        # data/app as well (app/ledger.html, index.html, app/*.html). The earlier step staged
        # only data/app, so the unstaged app/ledger.html made `git pull --rebase` refuse and
        # every run after 00:57Z failed here (runs 43815576157, 43864808752). Stage the whole
        # tree, commit, then rebase and push with bounded retries.
        if: github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          git config user.name "nba3-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          # Stage everything the run changed, not a fixed list: the rebuild can touch any
          # generated file, and ANY unstaged change makes `git pull --rebase` refuse to run
          # (simulated in a scratch remote with a README change: 3 of 3 attempts failed).
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to refresh"
            exit 0
          fi
          git commit -m "scheduled official refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "pushed refresh commit on attempt $attempt"
              exit 0
            fi
            echo "::warning::push attempt $attempt failed; aborting any rebase and retrying"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          echo "::error::refresh commit could not be pushed to main after 3 attempts"
          exit 1
