name: official data refresh

on:
  schedule:
    # 05:15 / 11:15 / 17:15 / 23:15 UTC — around each official injury-report filing window
    - cron: "15 5,11,17,23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "fetch + gate report only (no rebuild, no commit)"
        default: "false"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: the commit step runs `git pull --rebase origin main` before pushing
          fetch-depth: 0

      - name: Fetch official sources (injury report, schedule, results, game books, team stats)
        run: python3 scripts/refresh_official.py ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Unit tests (full suite — captures, feed, ledger, estimators, gates, refresh harness)
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Commit refreshed captures and rebuilt outputs
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "nba3-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/app
          if git diff --cached --quiet; then
            echo "no changes to refresh"
          else
            git commit -m "scheduled official refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
