name: official data refresh

on:
  schedule:
    # 05:15 / 11:15 / 17:15 / 23:15 UTC — around each official injury-report filing window
    - cron: "15 5,11,17,23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "fetch + gate report only (no rebuild, no commit)"
        default: "false"

permissions:
  contents: write

# One refresh at a time: a second run waits instead of racing the push to main.
concurrency:
  group: official-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, matching pages.yml: several generated artefacts and audit legs in this
          # repository are diffed against a named earlier commit of main, and a shallow clone
          # cannot resolve those (the reason pages.yml already sets fetch-depth: 0). Refresh runs
          # the same trees, so a shallow checkout here is a difference without a purpose.
          fetch-depth: 0

      # ---------------------------------------------------------------------------
      # STEP ORDER IS A GATE, NOT A CONVENIENCE.
      #
      # The unit tests run BEFORE the live fetch on purpose. One of them,
      # tests/test_refresh_official.py::PublishedSlateTests::test_published_slate_matches_the_promotion,
      # reads data/app/official_slate_current.json — the file this job itself rewrites from the
      # live nba.com slate — and compares it with rows promoted from committed fixtures. Against
      # a live fetch of the real league feed those two can only agree by accident, which is why
      # runs 43742524756 (fetch), 43815576157 and 43864808752 (commit) and 43925193575 (step 4,
      # "Unit tests") went red while every suite passed on the committed tree. Testing the commit
      # we were given, then fetching, then rebuilding keeps each failure attributable:
      #   red at  Unit tests -> the committed tree is broken;
      #   red at  Fetch        -> an official source moved or is unreachable;
      #   red at  Gate         -> data is stale, so nothing may be rebuilt;
      #   red at  Rebuild replay -> a generated file was hand-edited.
      # A change request to make that test read a fixture instead of the live-written artefact is
      # logged in COORDINATION.md against the file's owner session (81800928); until it lands,
      # moving the step is what keeps this job honest instead of deleting the assertion.
      # ---------------------------------------------------------------------------
      - name: Self-diagnosis (clock, tree state, python)
        run: |
          set -uo pipefail
          echo "runner date      : $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "python           : $(python3 -VV)"
          echo "HEAD             : $(git rev-parse --short HEAD) ($(git log -1 --format=%s))"
          echo "clean tree       : $(git status --porcelain | wc -l) modified files at checkout"
          echo "scenario note    : the repository's data is stamped 2026-11; a runner clock outside"
          echo "                   that window makes any test that pins 'today' fail here and pass"
          echo "                   in a sandbox. Diff the two lines above before believing a red."

      - name: Unit tests against the committed tree (capture, feed, ledger, estimators, gates)
        # arena/b1ce1334 (B1-1): every suite's full output is kept under $RUNNER_TEMP/unit-logs and
        # uploaded when the run fails, and each failing test name is repeated as an annotation.
        # The gate itself is unchanged: any failing suite still fails this step.
        run: |
          set -uo pipefail
          # scripts/run_suite_battery.py runs each suite as its own subprocess and, on failure,
          # writes the failing suite's traceback tail into a ::error:: annotation. The inline loop
          # this replaces could only say "at least one unittest suite failed", and seven scheduled
          # runs (43982186917 through 44424736929) were red at this step with the same tree green in
          # a sandbox — the suite name and the interpreter are now in the annotations API, which is
          # reachable from environments that cannot download a log archive.
          # Root cause of those seven, established from run 44616982969's annotation: the loop invoked
          # one suite as `python -m unittest tests/test_refresh_official.py`, a FILE PATH deprecated
          # in 3.11 and rejected by newer interpreters, so the runner's /usr/bin/python3 3.12.3
          # reported a loader failure for that suite while every 3.11 sandbox reported OK. The
          # battery's argv is pinned to interpreter-stable forms by tests/test_refresh_diagnostic.py.
          # The battery covers the suites this step used to list inline, in particular
          # test_round_2ecbccfd (the round's own gates), test_refresh_official, test_freshness_gates,
          # test_pick_ledger, test_results_feed, test_results_feed_rows, test_gamecard_feed,
          # test_standings_feed and the 11/15 capture suites (test_*1115*).
          # scripts/run_suite_battery.py::SUITES is the single source of truth, and
          # tests/test_refresh_diagnostic.py fails if the workflow grows its own list again.
          # --log-dir keeps b1ce1334's per-suite transcript (B1-1): the step below uploads it, and
          # because the log body is not retrievable from every environment, the files are written
          # per suite rather than only echoed.
          logdir="$RUNNER_TEMP/unit-logs"
          mkdir -p "$logdir"
          log="$logdir/battery.txt"
          python3 scripts/run_suite_battery.py \
            --log-dir "$logdir" \
            --json-out "$RUNNER_TEMP/nba3-battery.json" --annotate 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          # The log body is not retrievable from every environment, so each failing test name is
          # repeated as an annotation (b1ce1334's B1-1 shape, kept while the executor changed).
          grep -E "^(FAIL|ERROR): " "$log" | sed 's/^/::error::unit: /' | head -40 || true
          if [ "$rc" -ne 0 ]; then
            echo "::error::a unit suite failed on the committed tree; the annotations name the tests"
            exit 1
          fi

      - name: Upload unit-test logs from a failed run
        if: failure() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/unit-logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Fetch official sources (injury reports, schedule, standings, results, game books, team stats)
        run: |
          # pdftotext turns each archived injury PDF into the verbatim text kept in
          # data/app/injury_reports_archive/ (the runner image does not ship poppler
          # in every revision, so install it explicitly).
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils || {
            echo "::error::poppler-utils install failed (apt) — the archive step cannot run"; exit 1; }
          # tee keeps the body in the log while refresh_official.py emits ::error::
          # annotations for the failed source / gate / rebuild step; the grep below
          # surfaces any traceback as annotations too (the runner log body is not
          # retrievable through the API from every environment, but annotations are).
          if python3 scripts/refresh_official.py ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} 2>&1 | tee /tmp/refresh_official.log; then
            rc=0
          else
            rc=$?
          fi
          if [ "$rc" -ne 0 ]; then
            grep -E "Traceback|ERROR|Error|error|FAILED|required" /tmp/refresh_official.log \
              | tail -25 | sed 's/^/::error::refresh: /' || true
            exit "$rc"
          fi

      # ---------------------------------------------------------------------------
      # The 2026-11-17 round's own chain (session arena/2ecbccfd-nba3). These steps are offline
      # and deterministic by construction: they parse verbatim transcripts committed under
      # data/rounds/2026-11-17/captures/ instead of reaching the network. They are consecutive
      # hard gates: do not use `always()` here. A failed fetch or capture must skip the freshness
      # gate, and a failed freshness gate must skip every model/site step.
      # ---------------------------------------------------------------------------
      - name: Round 2026-11-17 - capture integrity (standings + both injury-report revisions)
        if: success()
        run: |
          set -uo pipefail
          test -f data/rounds/2026-11-17/captures/standings_2026-11-16_raw.md || {
            echo "::error::the standings transcript is missing; the standings capture is the only"
            echo "          provenance for the W/L/GP reconciliation, so the round cannot be built"; exit 1; }
          test -f data/rounds/2026-11-17/captures/injury_2026-11-16_0115PM_raw.md || {
            echo "::error::the 01:15 PM injury PDF transcript is missing; without it the report diff"
            echo "          has no second revision and the injury freshness gate would be unverifiable"; exit 1; }
          python3 scripts/capture_2ecbccfd.py --check || {
            echo "::error::capture_2ecbccfd.py --check failed (capture integrity)"; exit 1; }
          if ! python3 scripts/gamebooks_2ecbccfd.py --check; then
            echo "::error::gamebooks_2ecbccfd.py --check failed (capture integrity)"
            diag="$RUNNER_TEMP/nba3-gamebooks-mismatch.txt"
            {
              echo "source fingerprints (team registry and verbatim game-book transcripts):"
              sha256sum data/live/team_registry.json data/rounds/2026-11-17/captures/gamebook_*.md
            } | tee "$diag"
            out=data/rounds/2026-11-17/player_logs_2026-11-15.json
            tmp=$(mktemp)
            had_output=0
            if [ -f "$out" ]; then cp "$out" "$tmp"; had_output=1; fi
            python3 scripts/gamebooks_2ecbccfd.py || true
            if [ "$had_output" -eq 1 ] && [ -f "$out" ]; then
              {
                echo "generated-versus-committed player-log diff (first 120 lines):"
                diff -u "$tmp" "$out" | head -n 120 || true
              } | tee -a "$diag"
              cp "$tmp" "$out"
            else
              echo "expected player-log artefact was missing before regeneration" | tee -a "$diag"
              rm -f "$out"
            fi
            rm -f "$tmp"
            exit 1
          fi
          python3 scripts/slate_extra_2ecbccfd.py --check || {
            echo "::error::slate_extra_2ecbccfd.py --check failed (capture integrity)"; exit 1; }

      - name: Round 2026-11-17 - freshness and provenance gates (rebuild is blocked from here)
        if: success()
        run: |
          set -uo pipefail
          # The gate script runs first and its exit code is the only thing the rebuild obeys.
          # The shared gate script first (it takes no --json-out flag; passing one is a bug this
          # workflow used to have, and tests/test_refresh_official.py now pins it).
          python3 scripts/freshness_gates.py || {
            echo "::error::shared freshness/provenance gate failed; the site must not be rebuilt from"
            echo "          stale or unattributed data, so this step stops here on purpose"; exit 1; }
          # ...then this round's own gates, recomputed from the artefacts and asserted here.
          python3 - <<'PY'
          import json, sys
          g = json.load(open("data/rounds/2026-11-17/gates.json"))
          rows = g["gates"]
          bad = [x for x in rows if not x.get("pass")]
          if bad:
              print(json.dumps(bad, indent=1), file=sys.stderr)
              sys.exit("::error::a round gate that must pass is failing; the remedy field says what to do")
          print(f"round gates OK ({len(rows)} checked, all_pass={g['all_pass']})")
          PY

      - name: Round 2026-11-17 - model, ledger, site (only after the gates above)
        if: success()
        run: |
          set -euo pipefail
          python3 scripts/model_2ecbccfd.py --check
          python3 scripts/ledger_2ecbccfd.py --check
          python3 round_2ecbccfd/build.py --check

      - name: Upload refresh diagnostics from a failed gate
        if: failure() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/nba3-gamebooks-mismatch.txt
            ${{ runner.temp }}/nba3-battery.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit refreshed captures and rebuilt outputs
        # The rebuild chain (scripts/refresh_official.py step 6) regenerates files OUTSIDE
        # data/app as well (app/ledger.html, index.html, app/*.html). The earlier step staged
        # only data/app, so the unstaged app/ledger.html made `git pull --rebase` refuse and
        # every run after 00:57Z failed here (runs 43815576157, 43864808752). Stage the whole
        # tree, commit, then rebase and push with bounded retries.
        if: github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          git config user.name "nba3-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          # Stage everything the run changed, not a fixed list: the rebuild can touch any
          # generated file, and ANY unstaged change makes `git pull --rebase` refuse to run
          # (simulated in a scratch remote with a README change: 3 of 3 attempts failed).
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to refresh"
            exit 0
          fi
          git commit -m "scheduled official refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "pushed refresh commit on attempt $attempt"
              exit 0
            fi
            echo "::warning::push attempt $attempt failed; aborting any rebase and retrying"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          echo "::error::refresh commit could not be pushed to main after 3 attempts"
          exit 1
