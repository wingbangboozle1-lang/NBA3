name: refresh diagnosis (temporary)

# TEMPORARY diagnostic for session arena/64d8f868-nba3.
on:
  push:
    branches: ["arena/64d8f868-nba3"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          set -uo pipefail
          echo "::notice::diag python3 = $(python3 -VV 2>&1 | head -1)"

      - name: Battery under the runner default interpreter (compact failure report)
        run: |
          set -uo pipefail
          : > /tmp/diag_report.txt
          for suite in "test_*1115*.py" "test_results_feed.py" "test_pick_ledger.py" \
                       "test_freshness_gates.py" "test_refresh_official.py" \
                       "test_results_feed_rows.py" "test_gamecard_feed.py" "test_standings_feed.py" \
                       "test_round_2ecbccfd.py"; do
            if [ "$suite" = "test_refresh_official.py" ]; then
              out=$(python3 -m unittest tests/test_refresh_official.py 2>&1) && rc=0 || rc=$?
            else
              out=$(python3 -m unittest discover -s tests -p "$suite" 2>&1) && rc=0 || rc=$?
            fi
            if [ "$rc" -ne 0 ]; then
              {
                echo "=== SUITE $suite exit=$rc py=$(python3 -V 2>&1)"
                echo "$out" | grep -vE "ResourceWarning|tracemalloc" | \
                  awk '/^(FAIL|ERROR):/{f=1} f' | head -45
              } >> /tmp/diag_report.txt
            fi
          done
          if [ -s /tmp/diag_report.txt ]; then
            echo "::error::FAILING SUITES (runner default python):"
            sed 's/^/::error::/' /tmp/diag_report.txt
          else
            echo "::notice::all suites passed under the runner default interpreter"
          fi

      - name: Same battery under Python 3.11 (the Pages job's pinned version)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Battery on 3.11
        run: |
          set -uo pipefail
          : > /tmp/diag_report311.txt
          for suite in "test_*1115*.py" "test_results_feed.py" "test_pick_ledger.py" \
                       "test_freshness_gates.py" "test_refresh_official.py" \
                       "test_results_feed_rows.py" "test_gamecard_feed.py" "test_standings_feed.py" \
                       "test_round_2ecbccfd.py"; do
            if [ "$suite" = "test_refresh_official.py" ]; then
              out=$(python3 -m unittest tests/test_refresh_official.py 2>&1) && rc=0 || rc=$?
            else
              out=$(python3 -m unittest discover -s tests -p "$suite" 2>&1) && rc=0 || rc=$?
            fi
            if [ "$rc" -ne 0 ]; then
              {
                echo "=== SUITE $suite exit=$rc py=$(python3 -V 2>&1)"
                echo "$out" | grep -vE "ResourceWarning|tracemalloc" | \
                  awk '/^(FAIL|ERROR):/{f=1} f' | head -45
              } >> /tmp/diag_report311.txt
            fi
          done
          if [ -s /tmp/diag_report311.txt ]; then
            echo "::error::FAILING SUITES (Python 3.11):"
            sed 's/^/::error::/' /tmp/diag_report311.txt
          else
            echo "::notice::all suites passed under Python 3.11"
          fi
