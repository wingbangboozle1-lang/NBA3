name: refresh diagnosis (temporary)

# TEMPORARY diagnostic for session arena/64d8f868-nba3.
on:
  push:
    branches: ["arena/64d8f868-nba3"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          set -uo pipefail
          echo "::notice::diag python3 = $(python3 -VV 2>&1 | head -1)"

      - name: Regenerate the round artefacts and diff them against the committed files
        run: |
          set -uo pipefail
          for script in capture_2ecbccfd gamebooks_2ecbccfd slate_extra_2ecbccfd; do
            echo "--- $script --check (python $(python3 -V 2>&1))"
            python3 scripts/$script.py --check || echo "   check exit=$?"
          done
          cp data/rounds/2026-11-17/player_logs_2026-11-15.json /tmp/committed_logs.json
          python3 scripts/gamebooks_2ecbccfd.py > /tmp/gb.log 2>&1 || true; echo "regen exit=$?"
          echo "== first differing JSON paths (committed vs regenerated) =="
          python3 - <<'PY' > /tmp/diff.txt 2>&1
          import json
          a = json.load(open("/tmp/committed_logs.json"))
          b = json.load(open("data/rounds/2026-11-17/player_logs_2026-11-15.json"))
          def walk(x, y, path=""):
              if type(x) is not type(y):
                  print(f"TYPE  {path}: {type(x).__name__} != {type(y).__name__}"); return
              if isinstance(x, dict):
                  for k in sorted(set(x) | set(y)):
                      if k not in x: print(f"ONLY-B {path}.{k} = {y[k]!r}")
                      elif k not in y: print(f"ONLY-A {path}.{k} = {x[k]!r}")
                      else: walk(x[k], y[k], f"{path}.{k}")
              elif isinstance(x, list):
                  if len(x) != len(y):
                      print(f"LEN   {path}: {len(x)} != {len(y)}")
                  for i in range(min(len(x), len(y))):
                      walk(x[i], y[i], f"{path}[{i}]")
              else:
                  if x != y:
                      print(f"VALUE {path}: {x!r} != {y!r}")
          walk(a, b)
          PY
          head -40 /tmp/diff.txt
          echo "== raw diff (first 60 lines) =="
          diff -u /tmp/committed_logs.json data/rounds/2026-11-17/player_logs_2026-11-15.json | head -60 || true
          cp /tmp/committed_logs.json data/rounds/2026-11-17/player_logs_2026-11-15.json

      - name: Report
        run: |
          set -uo pipefail
          {
            echo "PY=$(python3 -VV 2>&1 | head -1)"
            echo "--- json diff ---"
            head -40 /tmp/diff.txt
            echo "--- raw diff ---"
            diff -u /tmp/committed_logs.json data/rounds/2026-11-17/player_logs_2026-11-15.json | head -50 || true
          } > /tmp/report.txt
          sed 's/^/::error::/' /tmp/report.txt
