name: determinism probe (temporary, session 89e98007)

# TEMPORARY — deleted before this PR merges. The refresh workflow's committed-tree preflight is the
# step that has been red since 2026-11-17, and this sandbox cannot read Actions logs or artifact
# blobs, so the only way to verify on the runner's own interpreter is to run the same suites and
# report through check-run annotations (the Checks API does return those).
#
# It runs (1) the six replayed artefact gates, (2) the refresh workflow's exact nine-suite loop, on
# the runner's default python3, and (3) prints the two candidate summations of the field that moved.
# Read-only: no fetch, no write, no commit, no push.

on:
  push:
    branches: ['arena/89e98007-nba3']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: replay the preflight on the runner's own interpreter
        timeout-minutes: 12
        run: |
          set +e
          {
            python3 tools/probe_determinism_89e98007.py
            echo "--- the refresh workflow's exact committed-tree suite loop ---"
            fail=0
            for suite in "test_*1115*.py" "test_results_feed.py" "test_pick_ledger.py" \
                         "test_freshness_gates.py" "test_refresh_official.py" \
                         "test_results_feed_rows.py" "test_gamecard_feed.py" "test_standings_feed.py" \
                         "test_round_2ecbccfd.py"; do
              if [ "$suite" = "test_refresh_official.py" ]; then
                cmd=(python3 -m unittest tests/test_refresh_official.py -v)
              else
                cmd=(python3 -m unittest discover -s tests -p "$suite" -v)
              fi
              out=$("${cmd[@]}" 2>&1); rc=$?
              echo "SUITE $suite rc=$rc $(echo "$out" | grep -E '^(OK|FAILED|Ran )' | tr '\n' ' ')"
              [ "$rc" -ne 0 ] && { fail=1; echo "$out" | grep -E '^(FAIL|ERROR): ' | head -5; }
            done
            echo "SUITE LOOP fail=$fail"
            echo "--- extra: this session's determinism suite ---"
            out=$(python3 -m unittest tests/test_determinism_89e98007 -v 2>&1)
            echo "DETERMINISM rc=$? $(echo "$out" | grep -E '^(OK|FAILED|Ran )' | tr '\n' ' ')"
            echo "DIRTY=$(git status --porcelain | wc -l)"
            echo "PROBE DONE"
          } > /tmp/probe.txt 2>&1
          one=$(tr '\n' '|' < /tmp/probe.txt | sed 's/|/%0A/g')
          printf '::notice::PROBE %s\n' "${one:0:12000}"
          printf '::notice::PROBE2 %s\n' "${one:12000:12000}"
          printf '::notice::PROBE3 %s\n' "${one:24000:12000}"
          grep -q "fail=1" /tmp/probe.txt && exit 1
          exit 0
